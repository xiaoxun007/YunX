name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        # 项目 settings.gradle.kts 按 YUNX_USE_MIRROR 切换仓库：CI 上阿里云镜像不可达，必须走官方源。
        # runner 镜像预装 Android SDK（licenses 已接受），AGP 会自动补装缺失的 SDK 组件。
        env:
          YUNX_USE_MIRROR: 'false'
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yunx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 构建产物自动发布到 GitHub Releases（与上游命名习惯一致：tag=v1.2.6-gh2，asset=YunX_release_1.2.6-gh2.apk）。
      # 同一版本号重复构建时更新已有资产（--clobber），不重复建 Release。
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          ASSET_NAME="YunX_release_${VERSION}.apk"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NOTES="自动构建（Debug，fork 版）"$'\n'"- 版本：${VERSION}"$'\n'"- 提交：${GITHUB_SHA:0:7}"$'\n'"- 触发：${GITHUB_EVENT_NAME}"
          cp "$APK" "$ASSET_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新资产 $ASSET_NAME"
            gh release upload "$TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "YunX_${VERSION}" \
              --notes "$NOTES"
          fi
